<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Codex 与 pi 的双模型协作流程：对齐、规划、实现、评审、合并，评审不通过回到实现">
  <style>
    text { font-family: -apple-system, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .card { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .pill { fill: #f6f8fa; stroke: #c8ced6; stroke-width: 1; stroke-dasharray: 4 3; }
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .s { fill: #59636e; font-size: 11.5px; }
    .lbl { fill: #59636e; font-size: 11px; }
    .flow { stroke: #8b949e; stroke-width: 1.6; fill: none; }
    .loop { stroke: #8b949e; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .tip { fill: #8b949e; }
    .dot { fill: #2f81f7; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #30363d; }
      .pill { fill: #161b22; stroke: #3d444d; }
      .t { fill: #e6edf3; }
      .s, .lbl { fill: #9198a1; }
      .flow, .loop { stroke: #6e7681; }
      .tip { fill: #6e7681; }
      .dot { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="tip" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="tip" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <g>
    <rect class="card" x="20"  y="70" width="152" height="64" rx="12"/>
    <rect class="card" x="200" y="70" width="152" height="64" rx="12"/>
    <rect class="card" x="380" y="70" width="152" height="64" rx="12"/>
    <rect class="card" x="560" y="70" width="152" height="64" rx="12"/>
    <rect class="card" x="740" y="70" width="152" height="64" rx="12"/>

    <circle class="dot" cx="42"  cy="92" r="3"/>
    <circle class="dot" cx="222" cy="92" r="3"/>
    <circle class="dot" cx="402" cy="92" r="3"/>
    <circle class="dot" cx="582" cy="92" r="3"/>
    <circle class="dot" cx="762" cy="92" r="3"/>

    <text class="t" x="96"  y="106" text-anchor="middle">对齐范围</text>
    <text class="t" x="276" y="106" text-anchor="middle">规划与验收</text>
    <text class="t" x="456" y="106" text-anchor="middle">实现</text>
    <text class="t" x="636" y="106" text-anchor="middle">评审</text>
    <text class="t" x="816" y="106" text-anchor="middle">合并</text>

    <text class="s" x="96"  y="124" text-anchor="middle">grill-with-docs</text>
    <text class="s" x="276" y="124" text-anchor="middle">plan-acceptance</text>
    <text class="s" x="456" y="124" text-anchor="middle">implement</text>
    <text class="s" x="636" y="124" text-anchor="middle">review-md</text>
    <text class="s" x="816" y="124" text-anchor="middle">merge</text>
  </g>

  <line class="flow" x1="176" y1="102" x2="196" y2="102" marker-end="url(#arrow)"/>
  <line class="flow" x1="356" y1="102" x2="376" y2="102" marker-end="url(#arrow)"/>
  <line class="flow" x1="536" y1="102" x2="556" y2="102" marker-end="url(#arrow)"/>
  <line class="flow" x1="716" y1="102" x2="736" y2="102" marker-end="url(#arrow)"/>

  <path class="loop" d="M636,70 V46 Q636,38 628,38 H464 Q456,38 456,46 V70" marker-end="url(#arrow-dash)"/>
  <text class="lbl" x="546" y="30" text-anchor="middle">changes requested</text>

  <rect class="pill" x="380" y="184" width="152" height="46" rx="23"/>
  <text class="t" x="456" y="203" text-anchor="middle" font-size="13">diagnose</text>
  <text class="s" x="456" y="219" text-anchor="middle">证据优先定位</text>
  <path class="loop" d="M456,184 V146" marker-end="url(#arrow-dash)"/>
</svg>
